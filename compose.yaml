services:
  hyperdriver:
    build:
      context: .
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      APP_URL: https://hyperdriver.com.br
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      DATABASE_FILE: /app/data/hyperdriver.sqlite
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./data/prod/db:/app/data
      - ./data/prod/files:/app/uploads
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
