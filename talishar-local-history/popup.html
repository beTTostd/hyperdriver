<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hyperdriver — Histórico Talishar</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="brand">
        <span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>Hyperdriver</strong></span>
      </header>
      <div class="intro">
        <p>Histórico de partidas do Talishar.</p>
        <div class="sector-bars" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
      <p id="status" role="status"></p>
      <section>
        <h2><span>01</span> Partidas locais</h2>
        <div id="matches" class="matches"></div>
        <nav id="pagination" class="pagination" aria-label="Paginação do histórico" hidden>
          <button id="previous-page" class="secondary" type="button">Anterior</button>
          <span id="page-indicator" aria-live="polite">Página 1 de 1</span>
          <button id="next-page" class="secondary" type="button">Próxima</button>
        </nav>
      </section>
      <section>
        <h2><span>02</span> Importar históricos</h2>
        <p class="import-help">Selecione os JSONs que você já salvou no computador para carregá-los nesta extensão.</p>
        <input id="import-files" type="file" accept=".json,application/json" multiple>
        <div class="import-actions">
          <button id="import-button" type="button">Selecionar JSONs</button>
          <button id="sync-button" class="secondary" type="button">Sincronizar tudo</button>
        </div>
      </section>
      <footer class="popup-footer" aria-label="Informações da extensão">
        <small>v1.5.2</small>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
