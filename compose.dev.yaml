services:
  hyperdriver-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.local
    ports:
      - "3101:3101"
    environment:
      NODE_ENV: development
      PORT: 3101
      APP_URL: https://beta.hyperdriver.com.br
      DOCKER_DEV: 1
      DATABASE_FILE: /app/data/hyperdriver.sqlite
      UPLOADS_DIR: /app/uploads
    volumes:
      - .:/app
      - /app/node_modules
      - ./data/dev/db:/app/data
      - ./data/dev/files:/app/uploads
    init: true
